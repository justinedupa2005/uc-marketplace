name: Staging backups and isolated restoration

on:
  workflow_call:
    inputs:
      operation:
        description: Explicit protected operation from the staging QA launcher
        type: string
        required: true
    secrets:
      OPS_DATABASE_URL:
        required: true
      OPS_SERVICE_ROLE_KEY:
        required: true
      RESTIC_PASSWORD:
        required: true
      BACKUP_ACCESS_KEY_ID:
        required: true
      BACKUP_SECRET_ACCESS_KEY:
        required: true
      OPS_MANAGEMENT_TOKEN:
        required: false
      OPS_VERCEL_TOKEN:
        required: false
      OPS_ALERT_WEBHOOK_URL:
        required: false
      OPS_BREVO_API_KEY:
        required: false
    # The caller must map these names, including environment-only secrets. The
    # reviewed staging-operations job resolves its own environment values.
    # Required declarations check mapping presence, not nonempty values; runtime
    # guards below independently reject empty bindings. No secrets: inherit.
  workflow_dispatch:
    inputs:
      operation:
        description: Staging-only operation (capture-restore restores the exact encrypted vault bundle)
        type: choice
        options: [plan, verify, capture-restore, check, monitor, alert-test, storage-drill, restore-drill]
        default: plan
        required: true
  schedule:
    - cron: "17 18 * * *" # 02:17 Asia/Manila; explicit owner activation required
    - cron: "47 18 * * 0" # Weekly full integrity read, not a restore claim
    - cron: "*/15 * * * *" # Disabled until monitoring credentials/channel are reviewed

permissions:
  contents: read
  actions: read

concurrency:
  group: uc-marketplace-staging-backups
  cancel-in-progress: false

jobs:
  plan-or-drill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && (inputs.operation == 'plan' || inputs.operation == 'storage-drill' || inputs.operation == 'restore-drill')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run ops:plan
      - if: inputs.operation != 'plan'
        run: npm run ops:install-restic
      - if: inputs.operation == 'storage-drill'
        run: npm run ops:drill:storage
        env:
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
      - if: inputs.operation == 'restore-drill'
        run: |
          npx playwright install --with-deps chromium
          npm run ops:drill
        env:
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
      # No hosted credentials or artifact uploads in synthetic drill jobs.

  encrypted-backup:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && (inputs.operation == 'verify' || inputs.operation == 'capture-restore' || inputs.operation == 'check')) || (github.event_name == 'schedule' && vars.STAGING_BACKUPS_ENABLED == 'true' && (github.event.schedule == '17 18 * * *' || github.event.schedule == '47 18 * * 0'))
    environment: staging-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run ops:install-restic
      - name: Install isolated image-decoding test browser
        if: inputs.operation == 'capture-restore' || github.event.schedule == '17 18 * * *'
        run: npx playwright install --with-deps chromium
      - name: Recheck current dependency evidence after protected review
        run: npm run qa:dependencies
      - name: Recheck exact source immediately before accessing backup credentials
        run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify staging and vault, or capture and restore the exact encrypted bundle
        if: inputs.operation == 'verify' || inputs.operation == 'capture-restore' || github.event.schedule == '17 18 * * *'
        run: |
          if [ "$OPS_OPERATION" = "verify" ]; then
            npm run ops:verify
          else
            npm run ops:cycle
          fi
        env:
          OPS_OPERATION: ${{ inputs.operation }}
          OPS_ENV: staging
          OPS_DATA_SCOPE: synthetic-only
          OPS_PROJECT_REF: niocptgzzbozpbfzifdk
          OPS_CONFIRM: niocptgzzbozpbfzifdk:backup
          OPS_RESTORE_CONFIRM: niocptgzzbozpbfzifdk:isolated-synthetic-restore
          OPS_SCHEDULED_CONFIRM: ${{ github.event_name == 'schedule' && 'staging-synthetic-only' || '' }}
          OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
          OPS_SERVICE_ROLE_KEY: ${{ secrets.OPS_SERVICE_ROLE_KEY }}
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
          RESTIC_REPOSITORY: ${{ vars.STAGING_BACKUP_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_REGION }}
      - name: Read and verify every encrypted repository block
        if: inputs.operation == 'check' || github.event.schedule == '47 18 * * 0'
        run: npm run ops:check
        env:
          OPS_ENV: staging
          OPS_DATA_SCOPE: synthetic-only
          OPS_PROJECT_REF: niocptgzzbozpbfzifdk
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
          RESTIC_REPOSITORY: ${{ vars.STAGING_BACKUP_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_REGION }}
      # Intentionally no production, restore-to-hosted, automatic prune,
      # environment dumps, SQL export files, or credential-bearing artifacts.

  monitoring:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.operation == 'monitor') || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' && vars.STAGING_MONITORING_ENABLED == 'true')
    environment: staging-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run ops:install-restic
      - name: Install the pinned operator-only Vercel CLI before any credentials
        run: npm install --prefix .qa/operations/vercel --no-save --ignore-scripts --no-audit --no-fund vercel@50.14.0
      - name: Recheck current dependency evidence after protected review
        run: npm run qa:dependencies
      - name: Recheck exact source before accessing monitoring credentials
        run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Collect sanitized health signals and optionally notify
        run: |
          if [ "$OPS_ALERTS_ENABLED" = "1" ]; then
            npm run ops:monitor -- --notify
          else
            npm run ops:monitor
          fi
        env:
          OPS_OPERATION: ${{ inputs.operation }}
          OPS_ENV: staging
          OPS_PROJECT_REF: niocptgzzbozpbfzifdk
          OPS_DATA_SCOPE: synthetic-only
          OPS_DATABASE_URL: ${{ secrets.OPS_DATABASE_URL }}
          OPS_MANAGEMENT_TOKEN: ${{ secrets.OPS_MANAGEMENT_TOKEN }}
          OPS_VERCEL_TOKEN: ${{ secrets.OPS_VERCEL_TOKEN }}
          OPS_VERCEL_CLI: ${{ github.workspace }}/.qa/operations/vercel/node_modules/vercel/dist/index.js
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
          RESTIC_REPOSITORY: ${{ vars.STAGING_BACKUP_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_REGION }}
          OPS_ALERTS_ENABLED: ${{ vars.STAGING_ALERTS_ENABLED == 'true' && '1' || '0' }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_BREVO_API_KEY: ${{ secrets.OPS_BREVO_API_KEY }}
      # All scheduled operations retain required review. No notification service,
      # tokens, automatic approvals or provider accounts are created implicitly.

  alert-delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.operation == 'alert-test'
    environment: staging-operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - name: Recheck current dependency evidence after protected review
        run: npm run qa:dependencies
      - name: Recheck staging before the single explicit Brevo delivery test
        run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Send exactly one synthetic operational test; no automatic retry
        run: npm run ops:alerts:test
        env:
          OPS_ENV: staging
          OPS_PROJECT_REF: niocptgzzbozpbfzifdk
          OPS_ALERTS_ENABLED: "1"
          OPS_ALERT_TEST_CONFIRM: ucmarketplace.security@gmail.com
          OPS_BREVO_API_KEY: ${{ secrets.OPS_BREVO_API_KEY }}
      # No database, Storage, vault, management or Vercel credentials in this job.
