name: Security and workflow checks

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      full_stack:
        description: Run real isolated Supabase Auth/SMTP/Storage/Realtime/concurrency/browser acceptance
        required: false
        default: false
        type: boolean
      synthetic_b2:
        description: Test only generated images in a new private Backblaze prefix (staging only; no deployment)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Deliberately inert public configuration. This job never uses hosted
      # project secrets and does not provision or modify any Supabase account.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ucmarketplace_anonymous_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record the exact tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Scan repository and Git history without displaying secrets
        run: npm run qa:secrets -- --history
      - name: Install locked dependencies
        run: npm ci
      - name: Generate route types and check TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Validate migrations and database authorization
        run: npm run test:db
      - name: Audit production and review development advisories
        run: npm run qa:dependencies
      - name: Production build
        run: npm run build
      - name: Check source boundaries and browser bundles
        run: npm run qa:security:bundles
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Authenticated API/Storage/concurrency/email acceptance remains a
      # separate explicit disposable-stack release gate; see the QA guide.
      # Do not upload traces, credentials, session state or private evidence.

  isolated-full-stack:
    if: github.event_name == 'workflow_dispatch' && inputs.full_stack
    needs: local-security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Creates a unique local-only project on distinct ports, derives its
      # credentials privately, runs real services, then stops only that project.
      # No repository secrets, linked migration push, global reset or purge.
      - run: npm run qa:local
      # Keep private test artifacts off GitHub uploads. GitHub-hosted runner
      # disposal is separate from the launcher's scoped, non-destructive stop.

  synthetic-backblaze:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging' && inputs.synthetic_b2
    needs: local-security
    environment: staging
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run ops:install-restic
      - name: Recheck exact staging source before accessing Backblaze credentials
        run: node scripts/operations/verify-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Encrypt and restore only generated images in a new private B2 prefix
        run: npm run ops:drill:b2
        env:
          OPS_B2_SYNTHETIC_CONFIRM: synthetic-only
          OPS_RESTIC_BINARY: ${{ github.workspace }}/.qa/tools/restic-0.19.1/restic
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      # No Supabase credentials, deployment, alert transport, raw diagnostics or
      # artifact uploads. Only encrypted synthetic artifacts remain at the
      # reported UUID prefix; existing repositories/lifecycles are untouched.
